<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#080808}canvas{display:block}</style><canvas width="1920" height="1080"></canvas><script>
const g=document.querySelector('canvas').getContext('2d');const E=x=>1-(1-Math.max(0,Math.min(1,x)))**3;
function text(s,x,y,z=40,c='#eee'){g.font=`600 ${z}px "PingFang SC"`;g.textAlign='center';g.fillStyle=c;g.fillText(s,x,y)}
function path(a,c='#ddd',w=4){g.beginPath();a.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.stroke()}
function box(x,y,w,h,lit=false){g.beginPath();g.roundRect(x,y,w,h,25);g.fillStyle=lit?'#282828':'#151515';g.fill();g.strokeStyle=lit?'#eee':'#666';g.lineWidth=lit?3:2;g.shadowColor='#ddd';g.shadowBlur=lit?14:0;g.stroke();g.shadowBlur=0}
function enter(t,fn){let p=E(t/.7);g.save();g.globalAlpha*=p;g.translate(0,35*(1-p));fn();g.restore()}
function link(x,y,w,t){let p=E(t/.8);if(p<=0)return;g.save();g.shadowColor='#fff';g.shadowBlur=12;path([[x,y],[x+w*p,y]]);g.beginPath();g.arc(x+w*p,y,5,0,7);g.fillStyle='#fff';g.fill();g.restore()}
function icon(i,x,y){g.save();g.translate(x,y);if(i===0){path([[-34,-42],[34,-42],[34,42],[-34,42],[-34,-42]]);for(let j=0;j<3;j++)path([[-19,-19+j*20],[19,-19+j*20]],'#bbb',3)}if(i===1){for(let j=0;j<3;j++){g.strokeStyle='#ddd';g.lineWidth=3;g.strokeRect(-65+j*47,-28,38,56);path([[-60+j*47,18],[-48+j*47,-2],[-35+j*47,18]],'#999',2)}}if(i===2){path([[-55,-36],[55,-36],[55,36],[-55,36],[-55,-36]]);path([[-12,-20],[23,0],[-12,20],[-12,-20]],'#eee',4)}g.restore()}
function intro(t){text('让 Agent 替你干活',960,175,66);enter(t,()=>{box(710,290,500,310,true);text('Agent',960,425,82);text('帮你干活的助手',960,515,38,'#bbb')});enter(t-.8,()=>{text('告诉它目标',420,460,38);link(580,450,130,t-1.4)});enter(t-1.6,()=>{text('组织操作',1490,460,38);link(1210,450,130,t-2)})}
function flow(t){text('从职场剧，到视频片段',960,175,64);const labels=['写职场剧','Skill 排分镜','生成视频片段'],desc=['故事与对白','镜头与画面','选一小段制作'];for(let i=0;i<2;i++)link(620+i*550,465,110,t-(2.4+i*3.2));for(let i=0;i<3;i++)enter(t-i*2.8,()=>{let x=180+i*550;box(x,300,440,335,i===Math.min(2,Math.floor(t/3.2)));icon(i,x+220,390);text(labels[i],x+220,520,42);text(desc[i],x+220,585,29,'#aaa')})}
function explain(t){text('你提要求，Agent 组织操作',960,175,62);enter(t,()=>{box(140,340,470,230);text('写一个职场剧',375,430,43);text('你告诉它要做什么',375,510,30,'#aaa')});link(610,455,130,t-.8);enter(t-.7,()=>{box(740,310,420,290,true);text('Agent',950,430,65);text('理解目标 · 安排步骤',950,520,29,'#ccc')});link(1160,455,110,t-2);for(let i=0;i<3;i++)enter(t-2.4-i*.75,()=>{let y=280+i*165;box(1270,y,490,125);text(['写故事','调用 Skill 排分镜','制作视频片段'][i],1515,y+76,35)});enter(t-5.2,()=>text('把接下来的操作串起来',960,760,40,'#bbb'))}
let clock=0;
const oldBox=box;box=(x,y,w,h,lit=false)=>{oldBox(x,y,w,h,lit);g.save();g.strokeStyle=lit?'#fff':'#777';g.lineWidth=2;for(const[sx,sy,dx,dy]of[[x-6,y-6,1,1],[x+w+6,y-6,-1,1],[x-6,y+h+6,1,-1],[x+w+6,y+h+6,-1,-1]])path([[sx,sy+dy*16],[sx,sy],[sx+dx*16,sy]],lit?'#eee':'#555',2);g.beginPath();g.roundRect(x+2,y+2,w-4,h-4,23);g.clip();if(lit){let yy=y+(clock%2.8)/2.8*h;let gr=g.createLinearGradient(0,yy-55,0,yy+20);gr.addColorStop(0,'#ffffff00');gr.addColorStop(.8,'#ffffff09');gr.addColorStop(1,'#ffffff00');g.fillStyle=gr;g.fillRect(x,y,w,h);path([[x+15,yy],[x+w-15,yy]],'#ffffff20',1)}g.restore()};
const oldLink=link;link=(x,y,w,t)=>{oldLink(x,y,w,t);if(t<.8)return;g.save();g.shadowColor='#fff';g.shadowBlur=16;let p=((t-.8)%1.5)/1.5;g.fillStyle='#fff';g.fillRect(x+p*(w-12),y-3,12,6);g.restore()};
const oldIcon=icon;icon=(i,x,y)=>{g.save();g.translate(x,y);g.strokeStyle='#ffffff26';g.lineWidth=1.5;g.beginPath();g.arc(0,0,66,clock*.45,clock*.45+4.6);g.stroke();for(let j=0;j<4;j++){let a=j*Math.PI/2+clock*.2;g.fillStyle='#aaa';g.fillRect(Math.cos(a)*66-2,Math.sin(a)*66-2,4,4)}g.restore();oldIcon(i,x,y);if(i===0){g.save();let yy=y-28+(clock%2)/2*58;path([[x-22,yy],[x+22,yy]],'#fff',2);g.restore()}if(i===1){let j=Math.floor(clock*1.5)%3;g.save();g.strokeStyle='#fff';g.shadowColor='#fff';g.shadowBlur=10;g.strokeRect(x-65+j*47,y-28,38,56);g.restore()}};
window.seek=t=>{clock=t;let b=g.createRadialGradient(960,420,0,960,500,1200);b.addColorStop(0,'#252525');b.addColorStop(1,'#070707');g.fillStyle=b;g.fillRect(0,0,1920,1080);g.save();for(let x=40;x<1920;x+=55)for(let y=35;y<1080;y+=55){g.fillStyle='#ffffff0a';g.fillRect(x,y,1.5,1.5)}g.strokeStyle='#ffffff07';g.lineWidth=1;for(let j=0;j<8;j++){g.beginPath();g.ellipse(960,510,340+j*100,140+j*40,0,0,Math.PI*2);g.stroke()}g.restore();const starts=[0,4,14],fns=[intro,flow,explain];let k=t<4?0:t<14?1:2;let local=t-starts[k];if(k>0&&local<1){g.save();g.globalAlpha=1-(local*local*(3-2*local));fns[k-1](starts[k]-starts[k-1]);g.restore()}g.save();g.globalAlpha=k?(Math.min(1,local)**2*(3-2*Math.min(1,local))):1;fns[k](local);g.restore()};window.ready=Promise.resolve();window.seek(0);
</script>
