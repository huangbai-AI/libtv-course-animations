<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#080808}canvas{display:block}</style><canvas width="1920" height="1080"></canvas><script>
const g=document.querySelector('canvas').getContext('2d');const ease=x=>1-(1-Math.max(0,Math.min(1,x)))**3;
function tx(s,x,y,z=38,c='#eee'){g.font=`600 ${z}px "PingFang SC"`;g.textAlign='center';g.fillStyle=c;g.fillText(s,x,y)}
function line(a,c='#aaa',w=4){g.beginPath();a.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.stroke()}
function box(x,y,w,h){g.beginPath();g.roundRect(x,y,w,h,24);g.fillStyle='#181818';g.fill();g.strokeStyle='#888';g.lineWidth=2;g.stroke()}
function icon(i,x,y){g.save();g.translate(x,y);if(i===0){line([[-42,-25],[30,-25],[30,15],[-20,15],[-38,32],[-38,15],[-42,15],[-42,-25]]);line([[-23,-8],[12,-8]])}if(i===1){for(let j=0;j<3;j++){line([[-40,j*22-24],[40,j*22-24]]);g.fillStyle='#fff';g.fillRect([-19,10,-5][j],j*22-31,8,14)}}if(i===2){line([[-43,-30],[35,-30],[35,30],[-43,30],[-43,-30]]);line([[-32,18],[-8,-5],[9,10],[25,-10]]);line([[10,34],[45,-5]],'#fff',7)}if(i===3){for(let j=0;j<3;j++){g.strokeStyle='#ddd';g.lineWidth=3;g.strokeRect(-45+j*32,-27,23,54)}line([[-9,3],[-2,10],[11,-8]],'#fff',4)}if(i===4){line([[-43,0],[43,0]]);for(let j=0;j<3;j++){g.beginPath();g.arc(-36+j*36,0,9,0,7);g.fillStyle='#ddd';g.fill()}}g.restore()}
window.seek=t=>{let b=g.createRadialGradient(960,410,0,960,500,1150);b.addColorStop(0,'#272727');b.addColorStop(1,'#070707');g.fillStyle=b;g.fillRect(0,0,1920,1080);tx('图片生成 · 本节回顾',960,160,65);const labels=['一句话生图','表达需求','修改图片','选择模型','实用功能'];const subs=['从想法开始','把画面说清楚','调整与完善','比较生成效果','生成前 · 生成后'];let active=Math.min(4,Math.floor(Math.max(0,t-1)/2.4));
// 每段连线仅在即将讲到下一项时绘制；不存在提前显示的底线。
for(let i=0;i<4;i++){let x=425+i*338,p=ease((t-(2.5+i*2.4))/.9);if(p>0){g.save();g.shadowColor='#fff';g.shadowBlur=18;line([[x,450],[x+58*p,450]],'#eee',4);if(p<1){g.beginPath();g.arc(x+58*p,450,5,0,7);g.fillStyle='#fff';g.fill()}g.restore()}}
for(let i=0;i<5;i++){let p=ease((t-i*.13)/.85),x=145+i*338,u=t-(i===0?.2:1+i*2.4),pulse=Math.max(0,1-u/1.05);if(u<0)pulse=0;g.save();g.globalAlpha=p;g.translate(x+140,455+(1-p)*65);let scale=.92+.08*p+.025*pulse;g.scale(scale,scale);g.translate(-x-140,-455);box(x,305,280,300);if(i===active){g.shadowColor='#fff';g.shadowBlur=18+14*pulse;g.strokeStyle='#eee';g.lineWidth=3;g.stroke();g.shadowBlur=0;g.save();g.clip();let s=ease(u/1.1);if(u>=0&&u<1.1){let a=x-180+s*640,gr=g.createLinearGradient(a,0,a+160,0);gr.addColorStop(0,'#ffffff00');gr.addColorStop(.5,'#ffffff25');gr.addColorStop(1,'#ffffff00');g.fillStyle=gr;g.fillRect(x,305,280,300)}g.restore()}g.save();g.translate(x+140,385);g.rotate(i===active?Math.sin(Math.max(0,u)*6)*.045*pulse:0);icon(i,0,0);g.restore();tx(labels[i],x+140,490,38);tx(subs[i],x+140,552,25,'#aaa');g.restore();if(pulse>0){g.save();g.globalAlpha=pulse*.3;g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.roundRect(x-12*(1-pulse),305-12*(1-pulse),280+24*(1-pulse),300+24*(1-pulse),26);g.stroke();g.restore()}}
let p=ease((t-11.5)/.8);g.save();g.globalAlpha=p;g.translate(0,15*(1-p));tx('把生成前后的操作串起来',960,750,39,'#ccc');g.restore()};window.ready=Promise.resolve();window.seek(0);
</script>
