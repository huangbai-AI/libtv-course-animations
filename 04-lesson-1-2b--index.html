<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#080808}canvas{display:block}</style><canvas width="1920" height="1080"></canvas><script>
const g=document.querySelector('canvas').getContext('2d');const e=x=>1-(1-Math.max(0,Math.min(1,x)))**3;
function tx(s,x,y,z=40,c='#eee'){g.fillStyle=c;g.textAlign='center';g.font=`600 ${z}px "PingFang SC"`;g.fillText(s,x,y)}
function box(x,y,w,h,on=false){g.beginPath();g.roundRect(x,y,w,h,25);g.fillStyle=on?'#242424':'#141414';g.fill();g.strokeStyle=on?'#eee':'#555';g.lineWidth=3;g.stroke()}
function path(ps){g.beginPath();ps.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.strokeStyle='#aaa';g.lineWidth=4;g.lineJoin='round';g.lineCap='round';g.stroke()}
function show(t,fn){let p=e(t/.75);g.save();g.globalAlpha=p;g.translate(0,22*(1-p));fn();g.restore()}
function icon(i,x,y){g.save();g.translate(x,y);if(i===0){path([[0,-45],[12,-12],[45,0],[12,12],[0,45],[-12,12],[-45,0],[-12,-12],[0,-45]])}if(i===1){box(-49,-35,98,75);path([[-49,-12],[49,-12]]);path([[-29,-35],[-9,-12],[10,-35],[30,-12]])}if(i===2){path([[-40,-25],[40,-25],[33,43],[-33,43],[-40,-25]]);path([[-20,-25],[-20,-43],[20,-43],[20,-25]])}if(i===3){path([[-14,32],[-14,-39],[35,-48],[35,23]]);g.beginPath();g.ellipse(-27,35,15,10,0,0,7);g.ellipse(22,26,15,10,0,0,7);g.fillStyle='#ddd';g.fill()}if(i===4){path([[10,-48],[-36,9],[-4,9],[-10,48],[37,-12],[7,-12],[10,-48]])}g.restore()}
window.seek=(t,part=0)=>{let grad=g.createRadialGradient(960,420,0,960,500,1200);grad.addColorStop(0,'#222');grad.addColorStop(1,'#080808');g.fillStyle=grad;g.fillRect(0,0,1920,1080);
if(part===0&&t<4){tx('课程分成两部分',960,170,65);show(t,()=>{box(170,320,720,360,true);tx('第 2–6 节',530,410,32,'#aaa');tx('工具讲解',530,520,66);tx('从零开始，学会操作',530,610,33,'#bbb')});show(t-.5,()=>{box(1030,320,720,360);tx('第 7–10 节',1390,410,32,'#aaa');tx('案例实战',1390,520,66);tx('通过案例，理解方法',1390,610,33,'#bbb')});return}
if(part===0){tx('第 2–6 节 · 工具讲解',960,145,62);tx('从零开始',960,225,32,'#aaa');let u=t-4;show(u,()=>{box(120,355,380,250,true);tx('画布与节点',310,470,42);tx('认识基础操作',310,535,29,'#aaa')});show(u-3,()=>{path([[500,480],[680,480]]);box(680,330,560,300,true);tx('图片  ·  视频  ·  声音',960,460,41);tx('学会生成内容',960,545,31,'#aaa')});show(u-9,()=>{path([[1240,480],[1400,480]]);box(1400,355,400,250,true);tx('Agent + Skill',1600,470,40);tx('把操作串起来',1600,535,29,'#aaa')});show(u-12,()=>{path([[310,650],[310,735],[1600,735],[1600,650]]);tx('从基础操作，到完整流程',960,790,34,'#ccc')})}
else{tx('第 7–10 节 · 案例实战',960,145,62);const names=['创意玩法','短剧','带货广告','MV','特效'];for(let i=0;i<5;i++){show(t-.5-i*1.6,()=>{let x=260+i*350;box(x-140,330,280,290,i===Math.min(4,Math.floor(Math.max(0,t-.5)/1.6)));icon(i,x,430);tx(names[i],x,563,39)})}show(t-9,()=>{path([[260,655],[260,715],[1660,715],[1660,655]]);tx('讲解制作思路与方法',960,790,39)})}};window.seek(0);
</script>
