<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#080808}canvas{display:block}</style><canvas width="1920" height="1080"></canvas><script>
const g=document.querySelector('canvas').getContext('2d');const e=x=>1-(1-Math.max(0,Math.min(1,x)))**3;
function tx(s,x,y,z=40,c='#eee'){g.fillStyle=c;g.textAlign='center';g.font=`600 ${z}px "PingFang SC"`;g.fillText(s,x,y)}
function box(x,y,w,h,on=false){g.beginPath();g.roundRect(x,y,w,h,26);g.fillStyle=on?'#252525':'#141414';g.fill();g.strokeStyle=on?'#eee':'#666';g.lineWidth=3;g.stroke()}
function path(ps){g.beginPath();ps.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.strokeStyle='#bbb';g.lineWidth=4;g.lineCap='round';g.lineJoin='round';g.stroke()}
function show(t,fn){let p=e(t/.8);g.save();g.globalAlpha=p;g.translate(0,25*(1-p));fn();g.restore()}
function play(x,y){path([[x-15,y-25],[x+25,y],[x-15,y+25],[x-15,y-25]])}
window.seek=(t,part=0)=>{let grad=g.createRadialGradient(960,420,0,960,500,1200);grad.addColorStop(0,'#242424');grad.addColorStop(1,'#080808');g.fillStyle=grad;g.fillRect(0,0,1920,1080);

else{tx('你的作品，可以用在哪里？',960,155,62);const titles=['朋友圈','自媒体平台','作品集'];const sub=['创意视频','短剧与短片','产品广告'];for(let i=0;i<3;i++)show(t-i*2.8,()=>{let x=170+i*570;box(x,300,440,365,i===Math.min(2,Math.floor(t/2.8)));if(i===0){box(x+160,345,120,100);play(x+220,395)}else if(i===1){box(x+166,337,108,130);play(x+220,402)}else{path([[x+160,380],[x+160,355],[x+280,355],[x+280,380]]);box(x+130,380,180,80)}tx(titles[i],x+220,530,46);tx(sub[i],x+220,600,35,'#bbb')});show(t-8.5,()=>{tx('用于求职与接单',1530,722,29,'#aaa')});show(t-10.5,()=>tx('坚持练习，积累自己的作品',960,795,38))}};window.seek(0);
</script>
