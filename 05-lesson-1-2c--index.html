<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#080808}canvas{display:block}</style><canvas width="1920" height="1080"></canvas><script>
const g=document.querySelector('canvas').getContext('2d'),names=['creative','advert','mv'],titles=['创意短片','产品广告','MV 片段'],imgs={};
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-(1-clamp(x))**4;
const load=src=>new Promise(r=>{let im=new Image();im.onload=()=>r(im);im.src=src});window.ready=Promise.all(names.map(async n=>{imgs[n]=await load(`assets/${n}/001.jpg`)}));
function tx(s,x,y,size=40,c='#eee',align='left'){g.fillStyle=c;g.textAlign=align;g.font=`600 ${size}px "PingFang SC"`;g.fillText(s,x,y)}
function fit(im,x,y,w,h){let s=Math.min(w/im.width,h/im.height);g.drawImage(im,x+(w-im.width*s)/2,y+(h-im.height*s)/2,im.width*s,im.height*s)}
function bg(t){let z=g.createRadialGradient(960+Math.sin(t*.4)*100,400,0,960,500,1200);z.addColorStop(0,'#292929');z.addColorStop(1,'#080808');g.fillStyle=z;g.fillRect(0,0,1920,1080);for(let i=0;i<28;i++){let x=(i*137+t*(5+i%4))%1920,y=210+(i*97)%600;g.fillStyle='#ffffff10';g.beginPath();g.arc(x,y,1.4,0,7);g.fill()}}
function sweep(x,y,w,h,p){if(p<=0||p>=1)return;g.save();g.beginPath();g.roundRect(x,y,w,h,22);g.clip();let a=x-w+p*w*3,gr=g.createLinearGradient(a,0,a+220,0);gr.addColorStop(0,'#ffffff00');gr.addColorStop(.5,'#ffffff25');gr.addColorStop(1,'#ffffff00');g.fillStyle=gr;g.fillRect(x,y,w,h);g.restore()}
window.seek=async t=>{bg(t);if(t<9){let k=Math.floor(t/3),u=t-k*3,p=ease(u/.65),f=Math.min(90,Math.floor(u*30)+1),im=await load(`assets/${names[k]}/${String(f).padStart(3,'0')}.jpg`);g.save();g.globalAlpha=.15;g.filter='blur(55px)';let s=Math.max(1920/im.width,1080/im.height);g.drawImage(im,(1920-im.width*s)/2,(1080-im.height*s)/2,im.width*s,im.height*s);g.restore();g.save();g.globalAlpha=.3+.7*p;tx(titles[k],130+(1-p)*65,150,58);tx('作品片段',1790,150,28,'#aaa','right');g.restore();g.save();g.translate(960+(1-p)*180,500);let sc=.88+.12*p+.015*u/3;g.scale(sc,sc);g.rotate((1-p)*-.025);g.shadowColor='#000';g.shadowBlur=45;fit(im,-620,-295,1240,590);g.restore();let h=590,ww=h*im.width/im.height,x=960-ww/2;g.strokeStyle='#ffffff55';g.lineWidth=2;g.strokeRect(x-7,198,ww+14,604);sweep(x,205,ww,h,(u-.45)/1.2);g.fillStyle='#555';g.fillRect(130,840,1660,2);g.fillStyle='#eee';g.shadowColor='#fff';g.shadowBlur=12;g.fillRect(130,839,1660*u/3,3);g.shadowBlur=0;
if(u<.35&&k>0){g.fillStyle=`rgba(255,255,255,${.12*(1-u/.35)})`;g.fillRect(0,0,1920,1080)}}else{let u=t-9;g.save();g.globalAlpha=ease(u/.6);tx('两大部分',130,145,60);g.restore();for(let i=0;i<3;i++){let p=ease((u-i*.13)/.85);g.save();g.globalAlpha=p;let x=130+i*565,y=240;g.translate(x+265,y+255+(1-p)*150);g.rotate((1-p)*(i-1)*.09);g.scale(.9+.1*p,.9+.1*p);x=-265;y=-255;g.shadowColor='#000';g.shadowBlur=35;g.beginPath();g.roundRect(x,y,530,510,22);g.fillStyle='#161616';g.fill();g.shadowBlur=0;g.strokeStyle='#888';g.lineWidth=2;g.stroke();fit(imgs[names[i]],x+18,y+18,494,365);tx(titles[i],x+28,y+442,36);tx(['朋友圈 · 创意分享','产品展示 · 作品集','音乐影像 · 自媒体'][i],x+28,y+482,26,'#aaa');sweep(x,y,530,510,(u-1-i*.25)/1.5);g.restore()}}};
</script>
