<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#111}canvas{display:block}</style><canvas width="1920" height="1080"></canvas><script>
const g=document.querySelector('canvas').getContext('2d'),im=new Image(),E=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};window.ready=new Promise(r=>{im.onload=r;im.src='assets/时间线.png'});

g.fillStyle='#1a1a1a';g.beginPath();g.roundRect(150,523,1620,275,20);g.fill();

clip(x,y,L,0,980,'前段');clip(b,y,R,1780,1050,'后段');

let reveal=E((t-8.7)/.7);if(reveal>0){g.save();g.globalAlpha=reveal;let nx=a+210*(1-insert),ny=285+(y-285)*insert;g.shadowColor='#000';g.shadowBlur=28*(1-insert);clip(nx,ny,M,980,800,'新片段',true);g.restore()}
