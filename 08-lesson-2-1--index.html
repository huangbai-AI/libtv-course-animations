<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#080808}canvas{display:block}</style><canvas width="1920" height="1080"></canvas><script>
const g=document.querySelector('canvas').getContext('2d');const ease=x=>1-(1-Math.max(0,Math.min(1,x)))**3;window.ready=Promise.resolve();
function txt(s,x,y,z=32,c='#fff'){g.fillStyle=c;g.font=`500 ${z}px "PingFang SC",sans-serif`;g.fillText(s,x,y)}
function box(x,y,w,h,r,fill,stroke){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=2;g.stroke()}}
function line(x1,y1,x2,y2,p){g.strokeStyle='#eee';g.lineWidth=5;g.beginPath();g.moveTo(x1,y1);g.lineTo(x1+(x2-x1)*p,y1+(y2-y1)*p);g.stroke();if(p>.98){g.beginPath();g.moveTo(x2-13,y2-10);g.lineTo(x2,y2);g.lineTo(x2-13,y2+10);g.stroke()}}
function mountain(x,y,w,h){box(x,y,w,h,10,'#303030');g.fillStyle='#ddd';g.beginPath();g.arc(x+w*.74,y+h*.25,15,0,7);g.fill();g.fillStyle='#777';g.beginPath();g.moveTo(x,y+h);g.lineTo(x+w*.35,y+h*.3);g.lineTo(x+w*.7,y+h);g.fill();g.fillStyle='#aaa';g.beginPath();g.moveTo(x+w*.35,y+h);g.lineTo(x+w*.7,y+h*.45);g.lineTo(x+w,y+h);g.fill()}
window.seek=t=>{g.fillStyle='#080808';g.fillRect(0,0,1920,1080);txt('认识 LibTV · 基础流程',100,116,52);txt('流程示意',1640,110,26,'#888');
box(100,185,1720,660,26,'#111','#414141');g.save();g.globalAlpha=.3;for(let x=130;x<1800;x+=28)for(let y=215;y<825;y+=28){g.fillStyle='#777';g.fillRect(x,y,2,2)}g.restore();
const labels=['画布','节点','连线'];let active=t<2?0:t<4?1:2;labels.forEach((s,j)=>{box(145+j*130,213,112,47,23,j===active?'#eee':'#242424');txt(s,171+j*130,247,26,j===active?'#111':'#999')});
const xs=[215,795,1375],starts=[1.5,2.3,3.1],names=['文字节点','图片节点','视频节点'];
for(let j=0;j<3;j++){let p=ease((t-starts[j])/.65);g.save();g.globalAlpha=p;let x=xs[j],y=360+(1-p)*35;box(x,y,330,330,18,'#1b1b1b',t>8+j*.7?'#eee':'#666');txt(names[j],x+26,y+54,34);g.strokeStyle='#444';g.beginPath();g.moveTo(x+22,y+78);g.lineTo(x+308,y+78);g.stroke();if(j===0){txt('描述你的想法',x+26,y+127,27,'#ddd');[226,190,240,150].forEach((w,k)=>box(x+26,y+156+k*28,w,8,4,'#626262'));}else{mountain(x+24,y+100,282,173);if(j===2){g.fillStyle='#fff';g.beginPath();g.moveTo(x+145,y+151);g.lineTo(x+145,y+204);g.lineTo(x+187,y+178);g.fill();box(x+24,y+292,282,5,2,'#555');box(x+24,y+292,282*ease((t-9.2)/2.5),5,2,'#fff')}}
for(let k of [0,1]){g.fillStyle='#eee';g.beginPath();g.arc(x+k*330,y+165,7,0,7);g.fill()}g.restore()}
for(let j=0;j<2;j++){let p=ease((t-4.1-j*1.25)/1);if(p>0){line(xs[j]+342,525,xs[j+1]-15,525,p);txt(j===0?'生成图片':'生成视频',xs[j]+374,485,25,'#aaa')}}
if(t>7){let p=ease((t-7)/.6);g.save();g.globalAlpha=p;txt('描述想法',254,765,30,'#ddd');txt('得到参考图',834,765,30,'#ddd');txt('生成动态画面',1400,765,30,'#ddd');g.restore()}
};window.seek(0);
</script>
