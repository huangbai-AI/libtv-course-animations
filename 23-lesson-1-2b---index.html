<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#100b1b}canvas{display:block}</style><canvas width="1920" height="1080"></canvas><script>
const g=document.querySelector('canvas').getContext('2d'),cache={},E=x=>{x=Math.max(0,Math.min(1,x));return 1-(1-x)**3},T={bg:'#0c0b10',purple:'#32105d',light:'#bca0ed',white:'#faf8ff'};
async function image(src){if(!cache[src])cache[src]=new Promise((r,j)=>{let i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=src});return cache[src]}
window.ready=Promise.all(['creative','advert','mv'].map(n=>image(`assets/cases/${n}/001.jpg`)));
function tx(s,x,y,z=60,c=T.white){g.fillStyle=c;g.textAlign='left';g.font=`600 ${z}px "PingFang SC"`;g.fillText(s,x,y)}
function bg(){let gr=g.createLinearGradient(0,0,1920,1080);gr.addColorStop(0,'#343638');gr.addColorStop(.52,'#18191b');gr.addColorStop(1,'#090a0b');g.fillStyle=gr;g.fillRect(0,0,1920,1080);let glow=g.createRadialGradient(600,-300,10,600,-300,1300);glow.addColorStop(0,'rgba(255,255,255,.18)');glow.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=glow;g.fillRect(0,0,1920,1080);g.fillStyle='#9066ce';g.fillRect(130,187,64,5)}
function panel(x,y,w,h,c=T.purple){g.save();g.beginPath();g.roundRect(x,y,w,h,26);if(c===T.purple){let gr=g.createLinearGradient(x,y,x+w,y+h);gr.addColorStop(0,'rgba(255,255,255,.16)');gr.addColorStop(1,'rgba(255,255,255,.035)');g.fillStyle=gr;g.fill();g.strokeStyle='rgba(255,255,255,.20)';g.lineWidth=1.5;g.stroke()}else{g.fillStyle=c;g.fill()}g.restore()}
function fit(i,x,y,w,h){let s=Math.min(w/i.width,h/i.height),a=x+(w-i.width*s)/2,b=y+(h-i.height*s)/2,iw=i.width*s,ih=i.height*s;g.save();g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=35;g.fillStyle='#121315';g.beginPath();g.roundRect(a,b,iw,ih,24);g.fill();g.shadowBlur=0;g.clip();g.drawImage(i,a,b,iw,ih);g.restore();g.save();let edge=g.createLinearGradient(a,b,a+iw,b+ih);edge.addColorStop(0,'#cbc9de');edge.addColorStop(.5,'#6655ab');edge.addColorStop(1,'#576da1');g.strokeStyle=edge;g.lineWidth=2;g.beginPath();g.roundRect(a,b,iw,ih,24);g.stroke();g.restore()}
function enter(u,fn){let p=E(u/.55);g.save();g.globalAlpha*=p;g.translate((1-p)*85,0);fn();g.restore()}
async function caseImg(n,u){return image(`assets/cases/${n}/${String(Math.min(90,1+Math.floor(Math.max(0,u)*30))).padStart(3,'0')}.jpg`)}
function giant(a,b,sub,u){enter(u,()=>{tx(a,130,350,115);tx(b,130,510,115,T.light);if(sub)tx(sub,140,635,38,'#d2cbdc')})}
async function scene(t,id){
if(id===0){if(t<7){tx('以前，制作内容',130,145,48,T.light);panel(130,260,790,470);tx('找人制作',190,400,95);tx('沟通需求 · 等待交付',190,535,36);enter(t-2,()=>{tx('学习软件',1020,400,95);tx('剪辑 / 设计 / 动效',1020,535,36,T.light)})}else{tx('现在，让想法成为画面',130,145,55);giant('你的想法','AI 来实现','普通人，也能开始创作',t-7);let im=await caseImg('creative',Math.min(2.9,t-7));fit(im,990,225,810,600)}}
if(id===1){let k=Math.min(3,Math.floor(t/3.5)),u=t-k*3.5;tx('新手的四个问题',130,145,48,T.light);const a=['工具','模型','第一步','专业级视频'],b=['怎么用？','怎么选？','从哪开始？','怎么做？'];enter(u,()=>{tx(a[k],130,390,k===3?118:150);tx(b[k],130,590,135,T.light)});panel(1470,230,320,550);tx(String(k+1).padStart(2,'0'),1500,610,210)}
if(id===2){if(t<4){tx('课程分成两部分',130,145,65);panel(130,280,790,480);tx('工具讲解',190,460,108);tx('第 2–6 节',190,585,45,T.light);tx('案例实战',1010,460,108);tx('第 7–10 节',1010,585,45,T.light)}else{let k=t<9?0:t<14?1:2,u=t-[4,9,14][k];tx('第 2–6 节 · 工具讲解',130,145,52,T.light);if(k===0){giant('从零开始','画布与节点','认识基础操作',u);panel(1120,290,540,350);tx('画布',1170,370,60);g.strokeStyle='#fff';g.lineWidth=6;g.beginPath();g.moveTo(1210,480);g.lineTo(1550,480);g.stroke();panel(1170,425,140,110,'#fff');panel(1460,425,140,110,'#fff')}if(k===1){giant('图片 · 视频','声音','学会生成内容',u);fit(await caseImg('creative',Math.min(2.9,t-9)),1070,245,690,550)}if(k===2){giant('Agent + Skill','把操作串起来','从基础操作，到完整流程',u)}}}
if(id===3){let k=Math.min(4,Math.floor(t/2.5)),u=t-k*2.5;tx('第 7–10 节 · 案例实战',130,145,52,T.light);const names=['创意玩法','短剧','带货广告','MV','特效'];enter(u,()=>tx(names[k],130,420,110));tx('制作思路与方法',140,570,40,T.light);let n=['creative',null,'advert','mv','creative'][k];if(n)fit(await caseImg(n,Math.min(2.9,u)),900,230,890,580);else{panel(960,250,770,490);tx('人物 × 情节',1030,440,70);tx('镜头 × 表演',1030,565,70,T.light)}}
if(id===4){if(t<9){let k=Math.floor(t/3),u=t-k*3,n=['creative','advert','mv'][k];tx(['创意短片','产品广告','MV 片段'][k],130,145,70);fit(await caseImg(n,u),200,205,1520,625)}else{tx('两大部分',130,145,85);panel(130,235,800,570);fit(await image('assets/cases/creative/001.jpg'),170,265,720,365);tx('朋友圈 · 创意分享',175,735,44);fit(await image('assets/cases/advert/001.jpg'),1030,235,750,255);fit(await image('assets/cases/mv/001.jpg'),1030,530,750,255);tx('产品展示 · 作品集',1030,520,31);tx('音乐影像 · 自媒体',1030,825,31)}}
if(id===5||id===6){tx('理论与实践，形成系统',130,145,62);if(t<3.4){enter(t,()=>{tx('理论',150,435,150);tx('理解制作思路',160,555,42,T.light)});enter(t-.7,()=>{tx('＋',840,435,125,T.light);tx('实践',1130,435,150);tx('跟着案例动手做',1140,555,42,T.light)})}else{enter(t-3.4,()=>{tx('把方法',130,350,110);tx('变成作品',130,510,110,T.light);tx('学完，收获自己的 AI 作品',140,650,38)});if(id===6){let f=Math.min(451,1+Math.floor((t-3.4)*30));fit(await image(`assets/fan/${String(f).padStart(4,'0')}.jpg`),1110,170,650,690)}else fit(await image('assets/cases/creative/001.jpg'),1010,230,770,570)}}
}
window.seek=async(t,id=0)=>{bg();let cuts=[[7],[3.5,7,10.5],[4,9,14],[2.5,5,7.5,10],[3,6,9],[3.4],[3.4]][id],cut=cuts.find(c=>t>=c&&t<c+.32);if(cut!==undefined){await scene(cut-.001,id);g.save();g.globalAlpha=E((t-cut)/.32);bg();await scene(t,id);g.restore()}else await scene(t,id)};
</script>
