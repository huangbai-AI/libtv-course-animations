<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#080808}canvas{display:block}</style><canvas width="1920" height="1080"></canvas><script>
const g=document.querySelector('canvas').getContext('2d'),cl=x=>Math.max(0,Math.min(1,x)),e=x=>1-(1-cl(x))**3;
function txt(s,x,y,z=42,col='#eee'){g.fillStyle=col;g.textAlign='center';g.font=`600 ${z}px "PingFang SC"`;g.fillText(s,x,y)}
function rect(x,y,w,h,fill='#181818',line='#555',r=24){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=fill;g.fill();g.strokeStyle=line;g.lineWidth=3;g.stroke()}
function line(points,col='#999',w=3){g.strokeStyle=col;g.lineWidth=w;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke()}
function scene(x,y,w,h,mode=0){g.save();g.beginPath();g.roundRect(x,y,w,h,15);g.clip();const b=g.createLinearGradient(x,y,x+w,y+h);b.addColorStop(0,mode===1?'#999':'#343434');b.addColorStop(1,'#151515');g.fillStyle=b;g.fillRect(x,y,w,h);g.fillStyle='#777';g.beginPath();g.arc(x+w*.76,y+h*.27,h*.09,0,7);g.fill();g.fillStyle='#505050';g.beginPath();g.moveTo(x,y+h*.8);g.lineTo(x+w*.32,y+h*.28);g.lineTo(x+w*.65,y+h*.8);g.lineTo(x+w*.8,y+h*.52);g.lineTo(x+w,y+h*.75);g.lineTo(x+w,y+h);g.lineTo(x,y+h);g.fill();g.fillStyle='#aaa';g.beginPath();g.arc(x+w*.34,y+h*.6,h*.038,0,7);g.fill();g.fillRect(x+w*.325,y+h*.64,w*.03,h*.18);if(mode===2){for(let i=1;i<3;i++){line([[x+w*i/3,y],[x+w*i/3,y+h]],'#bcbcbc',2);line([[x,y+h*i/3],[x+w,y+h*i/3]],'#bcbcbc',2)}}g.restore()}
function icon(i,x,y){g.save();g.translate(x,y);if(i===0){for(let j=0;j<3;j++)rect(-63+j*35,-40+j*13,62,78,['#ddd','#888','#333'][j],'#aaa',8)}if(i===1){g.strokeStyle='#eee';g.lineWidth=4;g.beginPath();g.arc(0,0,28,0,7);g.stroke();for(let j=0;j<8;j++){let a=j*Math.PI/4;line([[Math.cos(a)*40,Math.sin(a)*40],[Math.cos(a)*55,Math.sin(a)*55]],'#ddd',4)}}if(i===2){g.strokeStyle='#ddd';g.lineWidth=4;g.strokeRect(-65,-43,130,86);for(let j=1;j<3;j++){line([[-65+130*j/3,-43],[-65+130*j/3,43]],'#888',2);line([[-65,-43+86*j/3],[65,-43+86*j/3]],'#888',2)}}if(i===3){g.strokeStyle='#ddd';g.lineWidth=4;for(const r of [48,33,12]){g.beginPath();g.arc(0,0,r,0,7);g.stroke()}}g.restore()}
window.ready=Promise.resolve();window.seek=t=>{g.fillStyle='#080808';g.fillRect(0,0,1920,1080);const b=g.createRadialGradient(960,410,50,960,410,900);b.addColorStop(0,'#242424');b.addColorStop(1,'#080808');g.fillStyle=b;g.fillRect(0,0,1920,1080);
const change=e((t-9)/.8);if(change<1){g.save();g.globalAlpha=1-change;txt('画面描述',960,145,66);const p=e(t/.6);g.globalAlpha*=p;scene(180,250,760,430,t>4?1:0);if(t>2.8){const a=e((t-2.8)/.5);g.save();g.globalAlpha*=a;for(let i=1;i<3;i++){line([[180+760*i/3,250],[180+760*i/3,680]],'#999',2);line([[180,250+430*i/3],[940,250+430*i/3]],'#999',2)}g.restore()}txt('先说清想要的画面',560,748,36,'#bbb');const ls=['构图','光影','风格'];for(let i=0;i<3;i++){const a=e((t-2.5-i*1.35)/.65);g.save();g.globalAlpha*=a;let x=1120+(1-a)*45,y=270+i*145;rect(x,y,540,105,'#171717',a>.9?'#aaa':'#444');txt(ls[i],x+270,y+69,44);line([[940,465],[1030,465],[1030,y+52],[x,y+52]],'#777',3);g.restore()}g.restore()}
if(change>0){g.save();g.globalAlpha=change;txt('配套参考资料',960,145,64);const names=['风格','光线','构图','焦段'];for(let i=0;i<4;i++){const a=e((t-9.2-i*.55)/.65),x=330+i*420;g.save();g.globalAlpha*=a;g.translate(0,(1-a)*45);rect(x-180,245,360,350,'#161616','#666');icon(i,x,350);txt(names[i],x,475,46);const q=cl((t-12-i*.7)/.5);g.fillStyle='#ddd';g.fillRect(x-140,540,280*q,3);g.restore()}const q=e((t-14.2)/.6);g.globalAlpha=change*q;rect(650,665,620,100,'#eee','#eee');txt('预览  →  挑选',960,732,44,'#111');g.restore()}};window.seek(0);
</script>
