<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#080808}canvas{display:block}</style><canvas width="1920" height="1080"></canvas><script>
const g=document.querySelector('canvas').getContext('2d');window.ready=Promise.resolve();const e=x=>1-(1-Math.max(0,Math.min(1,x)))**3;
function text(s,x,y,size=40,c='#eee'){g.fillStyle=c;g.textAlign='center';g.font=`600 ${size}px "PingFang SC"`;g.fillText(s,x,y)}
function box(x,y,w,h,bright=false){g.beginPath();g.roundRect(x,y,w,h,24);g.fillStyle=bright?'#242424':'#151515';g.fill();g.strokeStyle=bright?'#eee':'#555';g.lineWidth=3;g.stroke()}
function line(a,b,c,d){g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.strokeStyle='#999';g.lineWidth=4;g.stroke()}
function show(p,fn){g.save();g.globalAlpha=p;g.translate(0,(1-p)*24);fn();g.restore()}
function picture(x,y){box(x,y,350,210,true);g.strokeStyle='#bbb';g.lineWidth=5;g.beginPath();g.moveTo(x+30,y+170);g.lineTo(x+115,y+80);g.lineTo(x+190,y+150);g.lineTo(x+250,y+100);g.lineTo(x+320,y+170);g.stroke();g.beginPath();g.arc(x+270,y+52,16,0,Math.PI*2);g.stroke()}
window.seek=(t,part=0)=>{const grad=g.createRadialGradient(960,420,30,960,500,1200);grad.addColorStop(0,'#202020');grad.addColorStop(1,'#070707');g.fillStyle=grad;g.fillRect(0,0,1920,1080);
if(part===0){text(t<7?'以前，制作内容':'现在，让想法成为画面',960,160,64);if(t<7){show(e(t/.6),()=>{box(190,300,650,370);text('找人制作',515,390,46);text('沟通需求',515,510,32,'#aaa');text('等待交付',515,570,32,'#aaa')});show(e((t-2)/.6),()=>{box(1080,300,650,370);text('自己学习软件',1405,390,46);for(let i=0;i<3;i++){box(1160+i*155,445,125,110);text(['剪辑','设计','动效'][i],1222+i*155,513,28)}text('投入时间学习',1405,620,32,'#aaa')});text('或',960,500,35,'#777')}else{let q=t-7;show(e(q/.65),()=>{box(155,340,400,260);text('脑海中的想法',355,450,42);text('把需求表达清楚',355,520,28,'#aaa')});show(e((q-.6)/.65),()=>{line(555,470,790,470);box(790,350,260,240,true);text('AI',920,493,92)});show(e((q-1.4)/.8),()=>{line(1050,470,1275,470);picture(1275,350);text('呈现画面',1450,650,40)});show(e((q-3)/.7),()=>text('普通人，也能开始创作',960,770,38,'#ccc'))}}
else{text('新手，常常卡在这些问题',960,155,62);const arr=['工具怎么用？','模型怎么选？','第一步从哪开始？','如何做出专业级视频？'];const xy=[[140,300],[1040,300],[140,570],[1040,570]];for(let j=0;j<4;j++){let p=e((t-j*2.6)/.7);show(p,()=>{let [x,y]=xy[j];box(x,y,740,200,j===Math.min(3,Math.floor(t/2.6)));text('?',x+85,y+128,72,'#888');text(arr[j],x+430,y+120,j===3?39:43)})}line(880,400,1040,400);line(880,670,1040,670)}
};window.seek(0);
</script>
