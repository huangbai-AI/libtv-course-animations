<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#080808}canvas{display:block}</style><canvas width="1920" height="1080"></canvas><script>
const g=document.querySelector('canvas').getContext('2d'),cl=x=>Math.max(0,Math.min(1,x)),e=x=>1-(1-cl(x))**3;
function txt(s,x,y,z=42,col='#eee'){g.fillStyle=col;g.textAlign='center';g.font=`600 ${z}px "PingFang SC"`;g.fillText(s,x,y)}
function box(x,y,w,h,fill='#191919',edge='#777'){g.beginPath();g.roundRect(x,y,w,h,24);g.fillStyle=fill;g.fill();g.strokeStyle=edge;g.lineWidth=3;g.stroke()}
function line(p,col='#aaa'){g.strokeStyle=col;g.lineWidth=4;g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke()}
function card(x,y,w,h,type){box(x,y,w,h,'#232323','#888');g.save();g.beginPath();g.roundRect(x+12,y+12,w-24,h-24,15);g.clip();const b=g.createLinearGradient(x,y,x+w,y+h);b.addColorStop(0,'#444');b.addColorStop(1,'#161616');g.fillStyle=b;g.fillRect(x+12,y+12,w-24,h-24);if(type===0){g.fillStyle='#999';g.beginPath();g.ellipse(x+w*.5,y+h*.41,w*.19,h*.23,0,0,7);g.fill();g.fillStyle='#666';g.beginPath();g.ellipse(x+w*.5,y+h*1.03,w*.4,h*.42,0,0,7);g.fill();g.fillStyle='#bbb';g.fillRect(x+w*.43,y+h*.6,w*.14,h*.12);line([[x+w*.4,y+h*.4],[x+w*.44,y+h*.4]],'#333');line([[x+w*.56,y+h*.4],[x+w*.6,y+h*.4]],'#333');line([[x+w*.46,y+h*.54],[x+w*.54,y+h*.54]],'#555')}else{g.fillStyle='#ccc';g.beginPath();g.arc(x+w*.73,y+h*.28,w*.09,0,7);g.fill();g.fillStyle='#777';g.beginPath();g.moveTo(x,y+h);g.lineTo(x+w*.35,y+h*.3);g.lineTo(x+w*.75,y+h);g.fill();g.fillStyle='#444';g.beginPath();g.moveTo(x+w*.3,y+h);g.lineTo(x+w*.75,y+h*.5);g.lineTo(x+w,y+h*.8);g.lineTo(x+w,y+h);g.fill()}g.restore()}
const photos=['person.jpg','style.png','result.png'].map(s=>{const im=new Image;im.src='assets/'+s;return im});
card=function(x,y,w,h,type){box(x,y,w,h,'#191919','#888');const im=photos[type];if(!im.complete)return;const scale=Math.min((w-20)/im.width,(h-20)/im.height);const iw=im.width*scale,ih=im.height*scale;g.save();g.beginPath();g.roundRect(x+8,y+8,w-16,h-16,16);g.clip();g.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih);g.restore()};
window.ready=Promise.all(photos.map(im=>new Promise(r=>im.onload=r)));window.seek=t=>{g.fillStyle='#080808';g.fillRect(0,0,1920,1080);const b=g.createRadialGradient(960,420,40,960,420,950);b.addColorStop(0,'#252525');b.addColorStop(1,'#080808');g.fillStyle=b;g.fillRect(0,0,1920,1080);txt('参考',960,145,66);const trans=e((t-7.4)/.8);
if(trans<1){g.save();g.globalAlpha=1-trans;txt('说清楚，参考什么',960,225,35,'#aaa');for(let i=0;i<2;i++){const a=e((t-.3-i*1.5)/.7);g.save();g.globalAlpha*=a;const x=365+i*720,y=300+(1-a)*45;card(x,y,270,340,i);line([[x+270,y+170],[x+335,y+170]]);txt(i?'画面风格':'人物长相',x+455,y+185,40);g.restore()}g.restore()}
if(trans>0){g.save();g.globalAlpha=trans;const multi=e((t-9.8)/.9);txt('单张或多张',960,230,40,'#ccc');const endX=[510,760,1010];for(let i=2;i>=0;i--){const a=i?multi:1;if(!a)continue;g.save();g.globalAlpha*=a;const x=i===0?800+(510-800)*multi:800+(endX[i]-800)*multi;const y=310+(i?30*(1-multi):0);card(x,y,210,280,i);g.restore()}g.save();g.globalAlpha*=multi;line([[1245,450],[1335,450]]);box(1340,388,270,125,'#e5e5e5','#eee');txt('生成模型',1475,466,38,'#151515');g.restore();const q=e((t-12.5)/.6);g.globalAlpha=trans*q;box(490,680,940,100,'#181818','#666');txt('数量上限，以具体模型为准',960,746,40);g.restore()}};window.seek(0);
</script>
