<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#080808}canvas{display:block}</style><canvas width="1920" height="1080"></canvas><script>
const g=document.querySelector('canvas').getContext('2d');window.ready=Promise.resolve();const ease=x=>1-(1-Math.max(0,Math.min(1,x)))**3;const titles=['生成模式','模型对比','提示词写法','快捷工具','声音生成节点'];

};window.seek(0);
